section: components
priority: 10
title: CornerBracket
tagline: 24 mm plywood corner bracket with four exact recessed M5 fixing seats
description: >
  One shared CornerBracket is reused by the standalone model and wooden HUB75
  assemblies. Its native outline includes the 0.6 mm arm-tip relief, with
  inner R4 fillet, broad-face chamfers and four local triangular arm-tip wedge
  cuts kept editable. Four fixing seats use separate flat head recess,
  90° transition, through-bore and 0.2 mm edge-relief features instead of one
  oversized countersink.
parameters: 24 mm width, 12 mm wall, 60 mm arms; four Ø5.4 bores with Ø10.4 × 1 mm head seats
stages:
  - Profile — 2D L outline with 0.6 mm arm-tip relief and arm-end bevels
  - Extrude — symmetric 24 mm body
  - Fillet — rounded inside corner R4
  - Chamfer — outside broad-face edges and continuous inside print-face relief
  - Arm-tip wedges — subtract four locally rotated triangular-prism relief cutters
  - Bolt seats — four Ø5.4 through bores with Ø10.4 × 1 mm flat head recesses
  - Edge relief — separate 0.2 mm outside and inside hole-edge flats
extra_views:
  title: Arm-tip relief review
  note: Dedicated durable build views expose the horizontal and vertical wedge corrections.
