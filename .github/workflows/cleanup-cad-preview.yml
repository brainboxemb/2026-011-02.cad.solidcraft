name: Clean CAD preview output

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout model-output
        uses: actions/checkout@v4
        with:
          ref: model-output
          path: model-output

      - name: Checkout Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Remove preview namespaces
        shell: bash
        run: |
          set -euo pipefail
          key="pr-${{ github.event.pull_request.number }}"
          rm -rf "model-output/previews/$key"
          rm -rf "pages/preview/$key"

      - name: Commit model-output cleanup
        shell: bash
        working-directory: model-output
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove merged/closed CAD preview pr-${{ github.event.pull_request.number }}"
          git push origin HEAD:model-output

      - name: Commit Pages preview cleanup
        shell: bash
        working-directory: pages
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove CAD preview pr-${{ github.event.pull_request.number }}"
          git push origin HEAD:gh-pages
