title: HUB75 Frame Tube — Ø10 × 1 mm
tagline: Reusable 360 mm hollow aluminum tube for the two-panel display frame
description: >
  One reusable purchased aluminum tube component shared by the top and bottom
  positions of the HUB75 tube-supported frame. The retained native source uses
  identical Ø10 mm outside / Ø8 mm inside geometry for both occurrences, so
  placement belongs to the assembly rather than to separate physical owners.
parameters: 360 mm default length; Ø10 mm OD; Ø8 mm ID; 1 mm wall; editable length
stages:
  - Sketch the native Ø10 outer profile on the YZ plane
  - Extrude symmetrically along local X to the editable tube length
  - Cut the concentric native Ø8 bore through the full length
  - Apply aluminum material metadata and appearance
extra_views:
  title: Tube profile review
  note: The end view verifies the annular Ø10/Ø8 section; the side view verifies the 360 mm source-derived default length.
