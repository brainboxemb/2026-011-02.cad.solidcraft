purpose: [example]
section: advanced
priority: 20
title: Simple MFT assembly
tagline: Simple MFT worktop on two 1 m M8 support rails with an 800 mm GuideRail
description: >
  The Simple MFT worktop is supported by two full-length M8 mounting rails
  underneath. Both rails start at the worktop left edge and extend 195 mm past
  the right edge. Their C-profile openings face outward while their perforation
  patterns run in the same left-to-right direction. The existing 800 mm
  Festool-profile GuideRail remains on top.
parameters: 805 × 555 × 18 mm worktop; 2 × 1000 mm Mounting Rail M8; 10 × 100 mm repeats per support rail; GuideRail 800 mm
stages:
  - Instantiate the reusable SimpleMFT worktop
  - Place two 1000 mm MountingRailM8 components below the worktop
  - Align both rail starts with the worktop left edge for 195 mm right overhang
  - Rotate upper and lower rails so both C-openings face outward
  - Keep both perforation sequences running in the same +X direction
  - Place the worktop underside on the upper edges of both support rails
  - Keep the 800 mm Festool-profile GuideRail on the worktop
extra_views:
  title: Support-rail layout
