purpose: [example]
section: subassemblies
group: display-frame
priority: 32
variants:
  hub75-display-frame-2panel:
    title: HUB75 2-Panel Display Frame
    tagline: Two HUB75 panels with seven shared Medium frame couplers
    description: >
      Framed version of the existing two-panel HUB75 screen. It keeps the same
      320 × 320 mm nominal two-panel grid and alternating right-panel
      orientation, then adds the shared Medium coupler family around the panel
      seam and outer frame: one middle coupler, two edge couplers and four
      corner couplers.
    parameters: 320 × 320 mm nominal frame; 2 panels; Medium couplers; 1 middle + 2 edge + 4 corner occurrences
    stages:
      - Reuse the same two panel occurrences as BasicHub75Screen2Panel
      - Place one Middle coupler at X=0 / Z=160 mm
      - Place Edge couplers at top Z=320 mm and bottom Z=0 mm
      - Place left/right corner definitions at the two top corners
      - Rotate their second occurrences 180° around Y for the bottom source pose
      - Verify all seven Medium coupler occurrences against the retained source layout
  hub75-display-frame-2panel-tube:
    title: HUB75 2-Panel Tube Frame
    tagline: Two-panel display frame with Ø10 tubes and eight Installed slide clamps
    description: >
      Tube-supported derivative of the accepted two-panel Display Frame. It
      retains the same panel grid and Middle coupler, uses the tube-ready Edge
      and Corner variants, and adds two 360 mm Ø10 × 1 mm aluminum tubes plus
      eight separate reusable tube-clamp occurrences at the source-derived
      datums. One shared clamp-bore dependency is controlled by an independent
      Installed Configuration Rule, enabled by default for the assembly.
    parameters: 320 × 320 mm nominal frame; 2 × Ø10 × 1 mm tubes at Y=-6 mm; tube Z=330/-10 mm; 8 loose clamps
    stages:
      - Reuse the accepted two-panel layout and Middle coupler
      - Replace Edge and Corner occurrences with their tube-ready variants
      - Place two 360 mm aluminum tubes along X at the authored Y/Z datums
      - Place four Edge clamps at X=±20 mm
      - Place four Corner clamps at X=±153 mm
      - Apply the authored 120° top/bottom clamp orientations
      - Drive all eight clamp bores from one assembly-owned Installed Configuration Rule
  hub75-display-frame-2panel-tube-dovetail:
    title: HUB75 2-Panel Tube Frame — Dovetail Receiver
    tagline: Two-panel tube frame with female receiver couplers and eight male clamps
    description: >
      Alternate tube-supported frame from the newly supplied total-model source.
      It reuses the same panel, tube and clamp placement contract as the existing
      tube frame, replaces only the coupler mechanical interface with female
      receivers, and uses the new male-dovetail clamp variant.
    parameters: 320 × 320 mm nominal frame; 2 × Ø10 × 1 mm tubes at Y=-6 mm; tube Z=330/-10 mm; 8 male clamps; 0.2 mm dovetail fit
    stages:
      - Reuse the common two-panel/two-tube structural layout
      - Use receiver Edge and Corner coupler variants
      - Place eight male-dovetail clamps at the existing source datums
      - Keep the source 120° top/bottom clamp orientations
      - Enable the independent Installed Configuration Rule for all clamps
      - Share TubeBottom placement behavior with #217 rather than adding a local workaround

