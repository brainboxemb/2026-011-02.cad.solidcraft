section: basic
priority: 30
title: Bolted Flange
tagline: A simple flange built from cylinders and native hole features
description: >
  A compact primitive model: Ø100 × 10 flange, Ø44 × 16 hub, Ø24 bore and six
  Ø9 bolt holes on a 70 mm PCD.
parameters: Ø100 × 26 mm overall; Ø44 hub; Ø24 bore; 6 × Ø9 on 70 mm PCD
stages:
  - Cylinder — Ø100 × 10 mm flange
  - Cylinder — Ø44 × 16 mm hub joined at Z=10
  - Hole — central Ø24 bore through 26 mm
  - Holes — six Ø9 holes on a 70 mm PCD
