name: CAD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build changed models, named models, or all models
        required: false
        default: changed
        type: choice
        options:
          - changed
          - models
          - all
      models:
        description: Space- or comma-separated model slugs for models mode
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  packages: read

concurrency:
  group: cad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-publish:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      MODE: ${{ github.event_name == 'schedule' && 'all' || inputs.mode || 'changed' }}
      MODELS: ${{ inputs.models || '' }}
    steps:
      - name: Checkout CAD source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout verified build output
        uses: actions/checkout@v4
        with:
          ref: build
          path: generated-build
          fetch-depth: 0

      - name: Checkout current Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap pinned tool.cad.ci
        run: python scripts/ci/bootstrap_cad_ci.py

      - name: Resolve CAD toolchain image
        id: image
        run: |
          python scripts/ci/cad_image.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable CAD toolchain image
        run: docker pull "${{ steps.image.outputs.reference }}"

      - name: Run selected CAD pipeline
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ steps.image.outputs.reference }}" \
            python scripts/ci/pipeline_ci.py \
              --mode "$MODE" \
              --models "$MODELS" \
              --base-sha "$BASE_SHA" \
              --head-sha "$SOURCE_SHA" \
              --event-name "${{ github.event_name }}" \
              --ref-name "$SOURCE_REF" \
              --pull-request "$PR_NUMBER" \
              --out output \
              --build-root generated-build \
              --previous-site pages \
              --workflow-run "$GITHUB_RUN_ID" \
              --image-reference "${{ steps.image.outputs.reference }}"

      - name: Upload CAD verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verification-${{ github.run_id }}
          path: |
            output/**
            build/models/basic/plate/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified build and site
        if: success()
        run: |
          python scripts/ci/publish_ci.py \
            --bundle output \
            --source-root . \
            --build-root generated-build \
            --pages-root pages \
            --workflow-event "${{ github.event_name }}" \
            --workflow-head-branch "$SOURCE_REF" \
            --workflow-head-sha "$SOURCE_SHA"

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout CAD source
        uses: actions/checkout@v4

      - name: Checkout build output
        uses: actions/checkout@v4
        with:
          ref: build
          path: generated-build
          fetch-depth: 0

      - name: Checkout Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove closed PR output
        run: |
          python scripts/ci/cleanup_ci.py "$PR_NUMBER" \
            --build-root generated-build \
            --pages-root pages
