title: Hub75Panel
tagline: One measured reusable P5 HUB75 panel component
description: >
  Shared panel component from the existing OpenSCAD reference: a
  159.70 × 319.71 × 14.50 mm envelope with four rear pockets, six rear-side
  Ø3 bores in Ø8.5 mounting tubes, separate rear reinforcement features, two
  locator pins and a grey housing material. Standalone uses the component's
  own local XY/Z axes; screen assemblies rotate the exact same class into
  world XZ.
parameters: 159.70 × 319.71 × 14.50 mm body; six Ø3 bores in Ø8.5 tubes; two Ø3 × 3 mm locator pins
stages:
  - Run the shared Hub75Panel component directly
  - Sketch and extrude the physical front envelope
  - Cut four rear electronics bays from the rear plane
  - Restore six Ø8.5 rear mounting tubes and their shallow circular reliefs
  - Add six separate reinforcement features beside the mounting tubes
  - Add two diagonal Ø3 × 3 mm locator pins
  - Cut the six Ø3 mounting bores through the proud tube faces
  - Assign grey housing material
