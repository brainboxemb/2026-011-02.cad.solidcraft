title: MFT Rail Corner Bracket
tagline: Printable 90° bracket with load-bearing rail feet and exact R18 lower corner
description: >
  Prototype monolithic corner bracket for the Simple MFT support frame. Two
  perpendicular 75 mm arms bolt through the existing round rail perforations at
  12.5 mm and 62.5 mm from each rail end. Two 6 mm-thick plastic shoes continue
  underneath the rail profiles so the rails actually rest on the bracket.
  The two shoes meet through the exact R18 lower outside-corner sector from the
  native source. Exposed corner filling/protection is now owned by the separate
  MFT Rail Corner Insert.
  Upper and lower triangular gussets stiffen the corner. The upper gusset
  includes one provisional countersunk fixing hole into the underside of the
  MFT worktop.
parameters: 75 mm arms; 5 mm walls/gussets; 6 mm under-rail feet; exact R18 lower corner; 4 × Ø8.5 rail holes; 1 × Ø5.5 / Ø10.5 countersunk MFT underside fixing
stages:
  - Arms — two perpendicular 75 × 27 × 5 mm rail-back flanges
  - Rail fixing — two Ø8.5 holes per arm aligned to the 12.5 / 62.5 mm round rail perforations
  - Rail feet — two 6 mm-thick plastic shoes under the first 75 mm of both rails
  - Lower corner — exact native R18 quarter-round support-foot sector
  - Top gusset — 55 mm triangular plate flush with the MFT underside at Z=0
  - MFT fixing — one provisional Ø5.5 through / Ø10.5 countersunk screw seat
  - Bottom gusset — matching triangular plate resisting corner racking
  - Material — dark PETG prototype presentation
extra_views:
