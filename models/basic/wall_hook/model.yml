purpose: [example]
section: basic
priority: 55
title: Wall Hook
tagline: Compact wall hook with a reinforced diagonal web
description: >
  Parametric reconstruction of the supplied tutorial wall hook. The confirmed
  source dimensions define the 57 mm high fork profile, 15 mm extrusion,
  6 mm walls, 20 mm fork opening, triangular gusset window and two chamfered
  Ø4.2 mm mounting holes. Only the visible profile/window fillet radii remain
  explicitly inferred from the rendered reference.
parameters: 57 mm high; 15 mm thick; 6 mm ribs; 20 mm fork opening; 2 × Ø4.2 mm holes; 1 mm hole chamfers
stages:
  - Draw the 57 mm outer fork and gusset profile
  - Extrude the profile to 15 mm
  - Author the provisional R2 outer corner rounds as native 2D circular arcs
  - Cut the 6 mm diagonal-wall triangular relief with native R2 corner arcs
  - Add two Ø4.2 through holes at 10 mm from top and 17 mm from bottom
  - Add 1 mm 90-degree chamfers at both faces of each screw hole
