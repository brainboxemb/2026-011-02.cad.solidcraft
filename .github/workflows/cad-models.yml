name: CAD models and site smoke tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Model selection mode
        type: choice
        required: true
        default: changed
        options:
          - changed
          - models
          - all
      models:
        description: Space- or comma-separated model slugs for models mode
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'changed' }}
      BUILD_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select affected models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/selection
          : > output/selection/changed-paths.txt

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only               "${{ github.event.pull_request.base.sha }}"               "${{ github.event.pull_request.head.sha }}"               > output/selection/changed-paths.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$'; then
              git diff --name-only "$before" "$GITHUB_SHA"                 > output/selection/changed-paths.txt
            else
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA"                 > output/selection/changed-paths.txt
            fi
          elif [ "$BUILD_MODE" = "changed" ]; then
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA"               > output/selection/changed-paths.txt
          fi

          python scripts/ci/select_models.py             --mode "$BUILD_MODE"             --kind scpf             --paths-file output/selection/changed-paths.txt             --models "$BUILD_MODELS"             --format json > output/selection/scpf.json
          python scripts/ci/select_models.py             --mode "$BUILD_MODE"             --kind scpc             --paths-file output/selection/changed-paths.txt             --models "$BUILD_MODELS"             --format json > output/selection/scpc.json

          echo "SCPF_MODELS=$(jq -r '.models | join(" ")' output/selection/scpf.json)" >> "$GITHUB_ENV"
          echo "SCPC_MODELS=$(jq -r '.models | join(" ")' output/selection/scpc.json)" >> "$GITHUB_ENV"

          echo "Changed paths:"
          cat output/selection/changed-paths.txt
          echo "SCPF models: $(jq -r '.models | join(" ")' output/selection/scpf.json)"
          echo "SCPC models: $(jq -r '.models | join(" ")' output/selection/scpc.json)"
      - name: Fetch exact SCPF library revision (vcs2l)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install vcs2l==1.1.7
          mkdir -p ext
          vcs import --input dependencies.repos ext
          python scripts/ci/check-pins.py
          python -m pip install -e ext/scpf/scpf
          python -m pip install -e ext/scpc
      - name: Compile selected project models with installed SCPF (no PYTHONPATH)
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          for model in $SCPF_MODELS; do
            python -m scpf "$(python scripts/ci/model_catalog.py "$model")"               --out "output/models/$model/scpf/solidcraft.json"
            python -m json.tool               "output/models/$model/scpf/solidcraft.json" >/dev/null
          done

          if [ -f output/models/hub75-panel/scpf/solidcraft.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/models/hub75-panel/scpf/solidcraft.json').read_text())
          commands=[x['command'] for x in data['commands']]
          assert commands.count('component.create') == 0
          assert commands.count('occurrence.move') == 0
          assert commands.count('solid.loft') == 1
          assert commands.count('sketch.rectangle.two_point') == 7
          assert commands.count('occurrence.copy') == 0
          assert commands.count('solid.hole') == 6
          assert sum(1 for c in data['commands'] if c['command']=='sketch.create'
                     and c['params'].get('name')=='Rear electronics bays') == 1
          PY
          fi

          if [ -f output/models/hub75-screen/scpf/solidcraft.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          screen=json.loads(Path('output/models/hub75-screen/scpf/solidcraft.json').read_text())
          screen_commands=[c['command'] for c in screen['commands']]
          assert screen_commands.count('component.create') == 1
          assert screen_commands.count('occurrence.copy') == 4
          assert screen_commands.count('occurrence.move') == 5
          placements=[c['params'] for c in screen['commands']
                      if c['command']=='occurrence.move']
          assert all('axis' in p and 'angle' in p and 'translate' in p
                     and 'matrix' not in p and 'to' not in p for p in placements)
          kinds=[c['command'] for c in screen['commands']]
          assert max(i for i,k in enumerate(kinds) if k=='occurrence.copy') < (
                 min(i for i,k in enumerate(kinds) if k=='occurrence.move'))
          PY
          fi
      - name: Compile selected independent SCPC command models
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          for model in $SCPC_MODELS; do
            python -m scpc "$(python scripts/ci/model_catalog.py "$model" scpc)"               --out "output/models/$model/scpc/solidcraft.json"
            python -m json.tool               "output/models/$model/scpc/solidcraft.json" >/dev/null
          done
      - name: Run project model regressions against installed SCPF
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m unittest discover -s tests -v
      - name: Generate and smoke-test complete static site from partial build
        run: |
          python scripts/ci/build-results.py             --generated output/models             --commit "$GITHUB_SHA"             --out output/site
          python scripts/ci/test-results.py output/site "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: cad-site-smoke
          path: |
            output/site/
            output/selection/
            output/models/
          if-no-files-found: error
