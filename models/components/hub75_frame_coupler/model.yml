purpose: [example]
section: components
group: display-frame
priority: 25
variants:
  hub75-frame-coupler-middle:
    title: HUB75 Frame Coupler — Middle
    tagline: Medium seam coupler shared by the two-panel display-frame family
    description: >
      Fixed Medium port of the native middle HUB75 frame coupler. The owner
      shares its source data, dimensions and helpers with the edge and corner
      variants so the future native configuration table can be added without
      moving or renaming the physical CAD family.
    parameters: Medium; 80 mm envelope; 4 mm wall; 3 mm base; 6 mm guide; Ø3.4 mounting bores
    stages:
      - Reuse the retained native SolidCraft Medium source data
      - Build the rounded cross base and four guide regions
      - Clear the two panel bushings
      - Add two mounting bores and two locator pad/pin stacks
      - Add the panel-seam guide
      - Cut native reference tick marks and blind tapered reference holes
  hub75-frame-coupler-edge:
    title: HUB75 Frame Coupler — Edge
    tagline: Medium straight edge coupler for a HUB75 display frame
    description: >
      Fixed Medium straight edge member from the shared HUB75 frame-coupler
      family. The native Medium panel-pin pass-through stays suppressed.
    parameters: Medium; 80 mm nominal size; 4 mm wall; 3 mm base; 6 mm guide; 2 × Ø3.4 mounting bores
    stages:
      - Extrude the source-derived Medium edge profile
      - Add the two bushing support zones
      - Cut the source two-section tapered rail clearance
      - Add two mounting bores and locator pads
      - Cut native reference tick marks and blind tapered reference holes
      - Keep the Medium-only panel-pin pass-through suppressed
  hub75-frame-coupler-corner-left:
    title: HUB75 Frame Coupler — Corner Left
    tagline: Medium left corner member from the shared HUB75 frame-coupler family
    description: >
      Fixed Medium left corner coupler, sharing all source dimensions and
      helper operations with the edge/right-corner members.
    parameters: Medium; 80 mm nominal size; 4 mm wall; 3 mm base; 6 mm guide; one Ø3.4 mounting bore
    stages:
      - Extrude the source-derived left-corner profile
      - Add the source bushing support
      - Cut the source two-section tapered rail clearance and bushing relief
      - Add one mounting bore and locator pad
      - Cut native reference tick marks and blind tapered reference holes
  hub75-frame-coupler-corner-right:
    title: HUB75 Frame Coupler — Corner Right
    tagline: Medium right corner member from the shared HUB75 frame-coupler family
    description: >
      Fixed Medium right corner coupler. The native Medium configuration keeps
      its panel-pin pass-through suppressed.
    parameters: Medium; 80 mm nominal size; 4 mm wall; 3 mm base; 6 mm guide; one Ø3.4 mounting bore
    stages:
      - Extrude the source-derived right-corner profile
      - Add the source bushing support
      - Cut rail and bushing clearance
      - Add one mounting bore and locator pad
      - Keep the Medium-only panel-pin pass-through suppressed
