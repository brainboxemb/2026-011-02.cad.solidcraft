name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_model_ci

      - name: "Verify #189 saved configuration switching"
        run: |
          git fetch --no-tags --depth=1 origin build
          baseline="$RUNNER_TEMP/hub75-medium-baseline"
          mkdir -p "$baseline"
          variants=(
            hub75-frame-coupler-middle
            hub75-frame-coupler-edge
            hub75-frame-coupler-corner-left
            hub75-frame-coupler-corner-right
            hub75-frame-coupler-edge-tube
            hub75-frame-coupler-corner-left-tube
            hub75-frame-coupler-corner-right-tube
            hub75-frame-coupler-edge-tube-receiver
            hub75-frame-coupler-corner-left-tube-receiver
            hub75-frame-coupler-corner-right-tube-receiver
          )
          for variant in "${variants[@]}"; do
            git show FETCH_HEAD:"dev/models/$variant/model.png" > "$baseline/$variant.png"
          done

          docker run --rm --pull=never \
            -e SOLIDCRAFT_GPU=cpu \
            -v "$PWD/build/dev:/output:ro" \
            -v "$baseline:/baseline:ro" \
            -v "$PWD/.github/verify-189.py:/verify.py:ro" \
            ghcr.io/brainboxemb/cad-solidcraft:v0.3.6 \
            python /verify.py

  build:
    name: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_model_ci

      - name: Publish build scope
        env:
          PYTHONPATH: modules/build/src
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          plan="build/$SOURCE_REF/build-plan.json"
          if [ ! -s "$plan" ]; then
            echo "No model build plan for $SOURCE_REF; build branch unchanged"
            exit 0
          fi

          publish_args=()
          if [ "$SOURCE_REF" = "main" ]; then
            publish_args+=(--full)
          fi

          python -m cad_model_build.publish \
            --repo . \
            --namespace "$SOURCE_REF" \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            "${publish_args[@]}"

      - name: Dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
