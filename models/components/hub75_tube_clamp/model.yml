purpose: [example]
section: components
group: display-frame
priority: 28
title: HUB75 Tube Clamp
tagline: Interchangeable tube-clamp interfaces for Ø10 display-frame tubes
description: >
  Reusable HUB75 tube-clamp family with a common elastic ring and document-owned
  Free/Installed fit configurations. Choose either the receiving female slot or the
  protruding male dovetail interface.
variants:
  hub75-tube-clamp:
    title: HUB75 Tube Clamp — Female Slot
    tagline: Parameterized printable tube clamp with receiving slide slot
    description: >
      Existing source-faithful receiving/female clamp interface. Tube diameter,
      clamp interference and clamp bore remain editable dependencies; Ø10 with
      0.4 mm interference gives a 9.6 mm Free bore. The standalone document
      exposes Installed by enabling one normally suppressed bore-widening cut
      to the tube diameter.
    parameters: Ø10 tube default; 0.4 mm clamp interference; 9.6 mm Free bore default; 12 mm clamp width; 16 mm slide run; 1 mm closed slot stop
    stages:
      - Reuse the shared elastic clamp-ring geometry
      - Add the active low integrated rounded slide back
      - Cut the active rounded receiving slot while preserving the 1 mm end stop
      - Preserve the parent 0.14 mm slot-entry chamfer
      - Add one normally suppressed Installed bore-widening history cut
      - Keep Free as the active standalone manufacturing configuration
  hub75-tube-clamp-male:
    title: HUB75 Tube Clamp — Male Dovetail
    tagline: Parameterized printable tube clamp with protruding male dovetail
    description: >
      Second physical interface variant from the newly supplied SolidCraft
      source. It shares the elastic clamp ring and Free/Installed fit state with
      the existing clamp, but uses only the final active male-dovetail history;
      the older female slot and intermediate dovetail experiments remain absent.
    parameters: Ø10 tube default; 0.4 mm clamp interference; 9.6 mm Free bore default; 12 mm head; 10.8 mm neck; 16 mm dovetail run; 0.4 mm flat groove bottoms
    stages:
      - Reuse the shared elastic clamp-ring geometry
      - Join the final 14-segment symmetric male dovetail profile
      - Preserve the 0.4 mm flat groove bottoms
      - Cut the mirrored final 45-degree flank corrections
      - Add one normally suppressed Installed bore-widening history cut
      - Keep Free as the active standalone manufacturing configuration
