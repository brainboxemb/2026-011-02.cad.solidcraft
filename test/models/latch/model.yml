priority: 30
title: Latch
tagline: Source-faithful native sheet-metal over-centre latch
description: >
  Generic latch component reconstructed from the original native SolidCraft
  design. The authoritative source is preserved at reference/latch.sc. The
  mechanism combines a 2 mm mounting foot, 1.6 mm operating handle, 2 mm pull
  bail, 0.7 mm locking spring/lip, hinge pins and revolved rivets. The released
  Forge sheet-metal and revolve primitives reproduce the native feature
  history without fused-solid approximations.
parameters: 73 mm overall; 43 × 16.5 × 2 mm mounting foot; Ø4.2 mounting holes; 16.5 mm handle; 23.5 mm pull bail; Ø3.8/Ø4 hinge and bail pins
stages:
  - Reference — preserve byte-identical native SolidCraft latch.sc
  - Mounting foot — 2.0 mm sheet, R0.6, K0.40
  - Operating handle — 1.6 mm sheet, R0.9, K0.40
  - Pull bail — 2.0 mm sheet, R1.0, K0.40
  - Locking spring/lip — 0.7 mm sheet, R0.8, K0.42
  - Pins and rivets — native cylindrical and revolved history

