title: Wall Hook
tagline: Compact wall hook with a reinforced diagonal web
description: >
  Parametric reconstruction of the supplied tutorial wall hook. The confirmed
  source dimensions define the 57 mm high XZ hook profile, 15 mm symmetric Y extrusion,
  6 mm walls, 20 mm hook opening, triangular gusset window and two Ø4.2 mm mounting holes through the rear 6 mm mounting wall. A separate Ø8 mm coaxial tool-access bore clears only the diagonal reinforcement in front of the lower screw so the mounting wall remains intact. Forge v0.18 applies a native 1.5 mm FRONT/BACK boundary chamfer while the screw holes keep independent 1.0 mm chamfers. Only the visible profile/window fillet radii remain explicitly inferred from the rendered reference.
parameters: 57 mm high; 15 mm wide; 6 mm ribs; 20 mm hook opening; 2 × Ø4.2 mm holes; Ø8 mm lower-screw tool access; 1 mm hole chamfers; 1.5 mm FRONT/BACK edge chamfer
stages:
  - Draw the 57 mm outer hook and reinforcement side profile in XZ
  - Extrude the profile symmetrically to 15 mm along Y
  - Author the provisional R2 outer corner rounds as native 2D circular arcs
  - Cut the 6 mm diagonal-wall triangular relief with native R2 corner arcs
  - Cut a separate Ø8 mm X-axis screwdriver access bore through only the diagonal reinforcement at the lower screw centre
  - Chamfer the complete FRONT/BACK face boundaries by 1.5 mm using Forge v0.18 native face selection
  - Add two Ø4.2 holes along X through the rear 6 mm mounting wall at Y=0, 10 mm from top and 17 mm from bottom
  - Add 1 mm 90-degree chamfers at both mounting-wall faces of each screw hole

