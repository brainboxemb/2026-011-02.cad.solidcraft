purpose: [example]
section: components
group: display-frame
priority: 25
title: HUB75 Frame Coupler
tagline: Configured frame-coupler family with standard and tube-clamp interfaces
description: >
  Reusable HUB75 frame-coupler family with native Small, Medium and Large
  configuration rows; Medium is the default. Standard seam/edge/corner members
  share one source-derived parameter graph with two tube-interface families:
  protruding rails for the female-slot clamp and female receivers for the
  male-dovetail clamp. Native reference ticks and blind tapered reference holes
  remain independently selectable creation options on every reusable coupler.
variant_groups:
  - title: Standard
    variants:
      - hub75-frame-coupler-middle
      - hub75-frame-coupler-edge
      - hub75-frame-coupler-corner-left
      - hub75-frame-coupler-corner-right
  - title: Tube — Rail
    variants:
      - hub75-frame-coupler-edge-tube
      - hub75-frame-coupler-corner-left-tube
      - hub75-frame-coupler-corner-right-tube
  - title: Tube — Receiver
    variants:
      - hub75-frame-coupler-edge-tube-receiver
      - hub75-frame-coupler-corner-left-tube-receiver
      - hub75-frame-coupler-corner-right-tube-receiver
variants:
  hub75-frame-coupler-middle:
    title: HUB75 Frame Coupler — Middle
    tagline: Configured seam coupler shared by the two-panel display-frame family
    description: >
      Native Small/Medium/Large middle coupler. The four size-table parameters
      drive the retained SolidCraft source relationships directly; Medium
      remains the active default row.
    parameters: Small / Medium / Large; Medium default; 80 mm default envelope; 4 mm wall; 3 mm base; 6 mm guide; Ø3.4 mounting bores
    stages:
      - Resolve the retained SolidCraft parameter graph from the four configured size parameters
      - Build the rounded cross base and four guide regions
      - Clear the two panel bushings
      - Add two mounting bores and two locator pad/pin stacks
      - Add the panel-seam guide
      - Cut native reference tick marks and blind tapered reference holes
  hub75-frame-coupler-edge:
    title: HUB75 Frame Coupler — Edge
    tagline: Configured straight edge coupler for a HUB75 display frame
    description: >
      Native Small/Medium/Large straight edge member from the shared coupler
      family. Small and Medium suppress the single stepped panel-pin
      pass-through; Large enables that same authored revolve cut.
    parameters: Small / Medium / Large; Medium default; 80 mm default size; 4 mm wall; 3 mm base; 6 mm guide; 2 × Ø3.4 mounting bores
    stages:
      - Build the source-derived configured edge base and guide stock
      - Preserve the native TOP-edge T clip and rounded guide ends
      - Add the two bushing support zones, mounting bores and locator pads
      - Cut the source two-section tapered rail clearance
      - Cut native reference tick marks and blind tapered reference holes
      - Control the exact stepped panel-pin pass-through from the native configuration table
  hub75-frame-coupler-corner-left:
    title: HUB75 Frame Coupler — Corner Left
    tagline: Configured left corner member from the shared HUB75 frame-coupler family
    description: >
      Native Small/Medium/Large left corner coupler sharing the same
      source-derived size parameters and helper operations as the Edge and
      right-corner members.
    parameters: Small / Medium / Large; Medium default; 80 mm default size; 4 mm wall; 3 mm base; 6 mm guide; one Ø3.4 mounting bore
    stages:
      - Build the source-derived configured left-corner base and guide stock
      - Add the source bushing support
      - Cut the source two-section tapered rail clearance and bushing relief
      - Add one mounting bore and locator pad
      - Cut native reference tick marks and blind tapered reference holes
  hub75-frame-coupler-corner-right:
    title: HUB75 Frame Coupler — Corner Right
    tagline: Configured right corner member from the shared HUB75 frame-coupler family
    description: >
      Native Small/Medium/Large right corner coupler. Small and Medium suppress
      the single stepped panel-pin pass-through; Large enables that same
      authored revolve cut.
    parameters: Small / Medium / Large; Medium default; 80 mm default size; 4 mm wall; 3 mm base; 6 mm guide; one Ø3.4 mounting bore
    stages:
      - Build the source-derived configured right-corner base and guide stock
      - Add the source bushing support
      - Cut rail and bushing clearance
      - Add one mounting bore and locator pad
      - Control the exact stepped panel-pin pass-through from the native configuration table
  hub75-frame-coupler-edge-tube:
    title: HUB75 Frame Coupler — Edge Tube
    tagline: Configured Edge coupler with two slide rails for loose Ø10 tube clamps
    description: >
      Tube-ready derivative of the configured Edge coupler. The shared
      Small/Medium/Large base is authored first; the retained clamp-foot
      clearance, two rails, bow clearance, rear support/base and asymmetric
      entry chamfers are then added downstream.
    parameters: Small / Medium / Large; Medium default; two rails at ±20 mm; R5 rear support; 14.75 mm rail height; 0.18/0.65 mm entry chamfer
    stages:
      - Reuse the shared configured Edge coupler history
      - Cut inward clearance for the two loose clamp feet
      - Add two source slide rails at 40 mm center spacing
      - Cut clamp-bow clearance at the inner side
      - Add the asymmetric source rail-entry chamfers
      - Join the final R5 rear support and continuous base around both clamps
      - Re-cut the selected reference marks into the new rear material
  hub75-frame-coupler-corner-left-tube:
    title: HUB75 Frame Coupler — Corner Left Tube
    tagline: Configured left Corner coupler with one loose-clamp slide interface
    description: >
      Tube-ready derivative of the configured left Corner coupler. Its
      Small/Medium/Large base remains shared with the standard member before the
      source insertion recess, Ø10.5 tube clearance, slide rail and asymmetric
      entry chamfer are added.
    parameters: Small / Medium / Large; Medium default; local rail center +7 mm; Ø10.5 tube clearance; 14.75 mm rail height
    stages:
      - Reuse the shared configured left Corner history
      - Cut the loose-clamp insertion recess
      - Cut the source tube clearance
      - Add the source slide rail
      - Add the asymmetric source rail-entry chamfer
  hub75-frame-coupler-corner-right-tube:
    title: HUB75 Frame Coupler — Corner Right Tube
    tagline: Configured right Corner coupler with one loose-clamp slide interface
    description: >
      Tube-ready derivative of the configured right Corner coupler. Its
      Small/Medium/Large base and panel-pin suppression remain shared before the
      mirrored insertion recess, Ø10.5 tube clearance, slide rail and
      asymmetric entry chamfer are added.
    parameters: Small / Medium / Large; Medium default; local rail center -7 mm; Ø10.5 tube clearance; 14.75 mm rail height
    stages:
      - Reuse the shared configured right Corner history
      - Cut the loose-clamp insertion recess
      - Cut the source tube clearance
      - Add the source slide rail
      - Add the asymmetric source rail-entry chamfer
  hub75-frame-coupler-edge-tube-receiver:
    title: HUB75 Frame Coupler — Edge Tube Receiver
    tagline: Configured Edge coupler with two female receivers for male tube clamps
    description: >
      Alternate tube-ready Edge interface on the same configured
      Small/Medium/Large base. It keeps the common inward clearances and final
      rear support/base, omits the protruding slide rails/chamfers, then joins
      two receiver feet and cuts the dovetail grooves with 0.2 mm flank
      clearance.
    parameters: Small / Medium / Large; Medium default; receivers at ±20 mm; 0.2 mm dovetail fit; 15.55 mm support height; 18.7 mm groove depth
    stages:
      - Reuse the shared configured Edge coupler history
      - Apply the shared inward clamp-foot and bow clearances
      - Preserve the final R5 rear support, base plate and reference recut
      - Add two 16 mm receiver supports
      - Cut two source 12-point female dovetail profiles with 0.2 mm clearance
  hub75-frame-coupler-corner-left-tube-receiver:
    title: HUB75 Frame Coupler — Corner Left Tube Receiver
    tagline: Configured left Corner coupler with one female receiver for a male tube clamp
    description: >
      Alternate left Corner tube interface on the shared Small/Medium/Large
      base, using the common insertion and Ø10.5 tube clearances followed by the
      final receiving dovetail geometry.
    parameters: Small / Medium / Large; Medium default; local receiver center +7 mm; Ø10.5 tube clearance; 0.2 mm dovetail fit
    stages:
      - Reuse the shared configured left Corner history
      - Apply the shared insertion and tube clearances
      - Add the 16 mm receiver support
      - Cut the source female dovetail groove and closed stop
  hub75-frame-coupler-corner-right-tube-receiver:
    title: HUB75 Frame Coupler — Corner Right Tube Receiver
    tagline: Configured right Corner coupler with one female receiver for a male tube clamp
    description: >
      Alternate right Corner tube interface on the shared Small/Medium/Large
      base, retaining the right-corner panel-pin suppression behavior before the
      mirrored common clearances and final receiving dovetail geometry.
    parameters: Small / Medium / Large; Medium default; local receiver center -7 mm; Ø10.5 tube clearance; 0.2 mm dovetail fit
    stages:
      - Reuse the shared configured right Corner history
      - Apply the shared insertion and tube clearances
      - Add the 16 mm receiver support
      - Cut the source female dovetail groove and closed stop
