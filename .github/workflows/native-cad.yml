name: Native SolidCraft CAD verification and results site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cad-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
      SOLIDCRAFT_GPU: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact library dependency and Python interface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install vcs2l==1.1.7
          mkdir -p ext
          vcs import --input dependencies.repos ext
          python scripts/ci/check-pins.py
          python -m pip install -e ext/scpf/scpf
          python -m pip install -e ext/scpc
          echo "SCPF_COMMIT=$(git -C ext/scpf rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download the verified official SolidCraft release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" --output "$ARCHIVE"
          grep -F " $ARCHIVE" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Compile and evaluate all ten project CAD models
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          solidcraft-cli --version
          python -c 'from scpf.version import check_cli_version; check_cli_version(require_cli=True)'
          for model in plate csg-cube bracket sample-plate plastic-enclosure plastic-enclosure-pi corner-bracket hub75-panel hub75-screen hub75-wood-frame; do
            mkdir -p "output/native/$model"
            python -m scpf "$(python scripts/ci/model_catalog.py "$model")" --out "output/native/$model/commands.json"
            solidcraft-cli run "output/native/$model/commands.json" \
              --param-check strict --results \
              --json-out "output/native/$model/results.json" \
              --save "output/native/$model/model.sc" \
              --out "output/native/$model/model.step"
            solidcraft-cli eval "output/native/$model/model.sc" \
              --json-out "output/native/$model/measurements.json"
            jq -e '(.timeline | all(.error == null))' "output/native/$model/measurements.json"
            test -s "output/native/$model/model.step"
            # For large screen/assembly models use a real model-centred camera.
            # The default ISO view may show only one corner of a wide assembly.
            # The CLI accepts an orbit camera JSON in millimetres and radians.
            snapshot_args=(--out "output/native/$model/model.png" --no-grid --no-axes)
            camera="$(python scripts/ci/snapshot_camera.py "$model")"
            if [ -n "$camera" ]; then
              snapshot_args+=(--camera "$camera")
            fi
            # CSG snapshots have historically been optional (CPU renderer).
            if [ "$model" = csg-cube ]; then
              if ! solidcraft-cli snapshot "output/native/$model/model.sc" "${snapshot_args[@]}"; then
                rm -f "output/native/$model/model.png"
                echo "CSG snapshot failed; native solid/STEP still verified."
              fi
            else
              solidcraft-cli snapshot "output/native/$model/model.sc" "${snapshot_args[@]}"
              test -s "output/native/$model/model.png"
            fi
          done
          # Front is +Y; rear with four pockets is -Y. No camera-only geometry trick.
          solidcraft-cli snapshot output/native/hub75-panel/model.sc \
            --out output/native/hub75-panel/front.png --no-grid --no-axes \
            --camera '{"target":[0,-7.25,160],"yaw":3.141592653589793,"pitch":0,"distance":460,"fov":0}'
          solidcraft-cli snapshot output/native/hub75-panel/model.sc \
            --out output/native/hub75-panel/rear.png --no-grid --no-axes \
            --camera '{"target":[0,-7.25,160],"yaw":0,"pitch":0,"distance":460,"fov":0}'
          test -s output/native/hub75-panel/front.png
          test -s output/native/hub75-panel/rear.png
          jq -e '
            ([.commands[] | select(.command == "component.create")] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.copy")] | length) == 0 and
            ([.commands[] | select(.command == "occurrence.move"
               and .params.axis == [1,0,0]
               and .params.angle == "90 deg"
               and .params.translate == [0,0,160])] | length) == 1 and
            ([.commands[] | select(.command == "solid.loft")] | length) == 1
          ' output/native/hub75-panel/commands.json
          jq -e '
            ([.commands[] | select(.command == "sketch.create" and
               .params.name == "Rear electronics bays")] | length) == 1 and
            ([.commands[] | select(.command == "sketch.rectangle.two_point")] | length) == 7 and
            ([.commands[] | select(.command == "solid.hole")] | length) == 6 and
            ([.commands[] | select(.command == "solid.extrude" and
               .params.operation == "cut" and
               .params.name == "Rear electronics bays" and
               .params.direction == "negative")] | length) == 1
          ' output/native/hub75-panel/commands.json
          unzip -p output/native/hub75-panel/model.sc document.json > output/native/hub75-panel/document.json
          jq -e '(.components | length) == 1 and (.occurrences | length) == 1
                 and ((.occurrences[0].transform[1][2] - 1) | fabs) < 0.000001
                 and ((.occurrences[0].transform[2][1] + 1) | fabs) < 0.000001
                 and ((.occurrences[0].transform[3][2] - 160) | fabs) < 0.000001' output/native/hub75-panel/document.json
          jq -e '
            ([.commands[] | select(.command == "component.create")] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.copy")] | length) == 4 and
            ([.commands[] | select(.command == "occurrence.move")] | length) == 5 and
            ([.commands[] | select(.command == "solid.loft")] | length) == 1
          ' output/native/hub75-screen/commands.json
          jq -e '
            ([.commands[] | select(.command == "sketch.create" and
              .params.name == "Rear electronics bays")] | length) == 1
          ' output/native/hub75-screen/commands.json
          unzip -p output/native/hub75-screen/model.sc document.json > output/native/hub75-screen/document.json
          jq -e '(.components | length) == 1 and (.occurrences | length) == 5
              and ([.occurrences[].transform[3][0]] == [0,-320,-160,160,320])
              and (all(.occurrences[]; ((.transform[3][2] - 160) | fabs) < 0.000001))
              and ((.occurrences[0].transform[1][2] - 1) | fabs) < 0.000001
              and ((.occurrences[2].transform[1][2] + 1) | fabs) < 0.000001
              and ((.occurrences[2].transform[0][0] + 1) | fabs) < 0.000001
              and ((.occurrences[2].transform[2][1] + 1) | fabs) < 0.000001' output/native/hub75-screen/document.json
          # Native BRep dimensions are independent evidence: each panel
          # must be 159.70 wide, 319.71 high in world Z and 14.50 deep in Y.
          # Confirm that the full assembled screen is 5 x 160 mm wide.
          jq -e '
            .body_count == 1 and
            ((.bodies[0].bbox.max[2] - .bodies[0].bbox.min[2] - 319.71) | fabs) < 0.001 and
            ((.bodies[0].bbox.max[1] - .bodies[0].bbox.min[1] - 14.50) | fabs) < 0.001
          ' output/native/hub75-panel/measurements.json
          jq -e '
            .body_count == 5 and
            (all(.bodies[];
              ((.bbox.max[2] - .bbox.min[2] - 319.71) | fabs) < 0.001
              and ((.bbox.max[1] - .bbox.min[1] - 14.50) | fabs) < 0.001))
            and (([.bodies[].bbox.min[0]] | min) + 399.85 | fabs) < 0.001
            and (([.bodies[].bbox.max[0]] | max) - 399.85 | fabs) < 0.001
          ' output/native/hub75-screen/measurements.json
          # Alternate panels are rotated 180° in the display plane:
          # the height axis is reversed, but the rear must stay at world -Y.
          # The shared CornerBracket is intentionally hole-free.
          # Verify native feature plans for the standalone definition and
          # full wooden assembly, while leaving HUB75 panel bores intact.
          jq -e '
            ([.commands[] | select(.command == "solid.hole")] | length) == 0 and
            ([.commands[] | select(.command == "solid.fillet")] | length) == 1 and
            ([.commands[] | select(.command == "solid.chamfer")] | length) == 3
          ' output/native/corner-bracket/commands.json
          # One shared CornerBracket, eight physical placements: at every
          # outside X/Z corner, a front and a rear bracket. No screw holes.
          jq -e '
            ([.commands[] | select(.command == "solid.hole")] | length) == 0 and
            ([.commands[] | select(.command == "component.create"
               and .params.name == "CornerBracket")] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.copy"
               and .params.component == "CornerBracket")] | length) == 7 and
            ([.commands[] | select(.command == "occurrence.move"
               and (.params.occurrence | startswith("CornerBracket:")))] | length) == 8 and
            ([.commands[] | select(.command == "solid.fillet")] | length) == 3
          ' output/native/hub75-wood-frame/commands.json
          # Four native groups and five lightweight panels; no additional
          # duplicate component definitions from the removed modules.
          jq -e '
            ([.commands[] | select(.command == "component.create" and
                .params.name == "HUB75Panels" and .params.activate == false)] | length) == 1 and
            ([.commands[] | select(.command == "component.create" and
                .params.name == "Hub75PanelBasic" and
                .params.parent == "HUB75Panels")] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.copy" and
                .params.component == "Hub75PanelBasic")] | length) == 4
          ' output/native/hub75-wood-frame/commands.json
          # Component copies all start at native origin; the final move
          # is handled by SolidCraft, never by custom Python matrices.
          jq -e '
            ([.commands[] | select(.command == "occurrence.copy"
              and (.params.component == "SideWall"
                or .params.component == "GlassStrip"
                or .params.component == "GlassStrip 2")
              and (.params | has("translate") | not))] | length) == 3 and
            ([.commands[] | select(.command == "occurrence.move"
              and .params.occurrence == "SideWall:1"
              and .params.translate[0] == -428)] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.move"
              and .params.occurrence == "SideWall:2"
              and .params.translate[0] == 428)] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.move"
              and .params.occurrence == "BackBoard:1"
              and .params.translate == [0,104.5,-12])] | length) == 1 and
            ([.commands[] | select(.command == "occurrence.move"
              and (.params | has("matrix") or has("to")))] | length) == 0
          ' output/native/hub75-wood-frame/commands.json
          # Only ONE GlassStrip Python class: two native dimension variants,
          # four separate physical occurrences and straight 45° mitres.
          jq -e '
            ([.commands[] | select(.command == "component.create"
              and (.params.name | startswith("GlassStrip")))] | length) == 2 and
            ([.commands[] | select(.command == "occurrence.move"
              and (.params.occurrence | startswith("GlassStrip:")))] | length) == 2 and
            ([.commands[] | select(.command == "occurrence.move"
              and (.params.occurrence | startswith("GlassStrip 2:")))] | length) == 2 and
            ([.commands[] | select(.command == "material.create"
              and .params.name == "LIGHTPLY glazing vertical"
              and .params.color == "#A9793E")] | length) == 1 and
            ([.commands[] | select(.command == "material.create"
              and .params.name == "LIGHTPLY glazing horizontal"
              and .params.color == "#E3BF80")] | length) == 1
          ' output/native/hub75-wood-frame/commands.json
          # Verify actual SolidCraft BRep bounds; a green JSON command
          # test alone does NOT prove the wood or glass is positioned well.
          jq -e '
            .body_count == 23 and
            (all(.bodies[] | select(.name | startswith("GlassStrip"));
              ((.bbox.min[1] - 0) | fabs) < 0.001 and
              ((.bbox.max[1] - 12) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("RoofBoard"));
              ((.bbox.min[1] + 10) | fabs) < 0.001 and
              ((.bbox.max[1] - 110) | fabs) < 0.001 and
              ((.bbox.min[2] - 362) | fabs) < 0.001 and
              ((.bbox.max[2] - 374) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("BackBoard"));
              ((.bbox.min[1] - 100) | fabs) < 0.001 and
              ((.bbox.max[1] - 109) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Window"));
              ((.bbox.min[1] - 12) | fabs) < 0.001 and
              ((.bbox.max[1] - 16) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Hub75PanelBasic"));
              ((.bbox.min[1] - 25) | fabs) < 0.001 and
              ((.bbox.max[1] - 39.5) | fabs) < 0.001))
          ' output/native/hub75-wood-frame/measurements.json
          # Rear bracket sidewall alignment is a physical requirement.
          # Sidewalls stop at Y=100; the attached backboard occupies Y=100..109.
          # The four rear brackets must stop at Y=100 (start at Y=76),
          # rather than overlap the 9 mm backboard as they used to.
          jq -e '
            ([.bodies[] | select(.name | startswith("CornerBracket"))] | length) == 8 and
            ([.bodies[] | select((.name | startswith("CornerBracket"))
               and .bbox.min[1] > 50)] | length) == 4 and
            (all(.bodies[] | select((.name | startswith("CornerBracket"))
               and .bbox.min[1] > 50);
               ((.bbox.min[1] - 76) | fabs) < 0.001 and
               ((.bbox.max[1] - 100) | fabs) < 0.001)) and
            (all(.bodies[] | select((.name | startswith("BackBoard")));
               ((.bbox.min[1] - 100) | fabs) < 0.001 and
               ((.bbox.max[1] - 109) | fabs) < 0.001))
          ' output/native/hub75-wood-frame/measurements.json
          # Geometry must physically stand in XZ, not only be camera-rotated.
          # Hub75PanelBasic dimensions are fixed product constants, so its
          # extrusion height is a literal rather than an editable parameter.
          jq -e '
            (any(.commands[] | select(.command == "solid.extrude");
              ((.params.distance - 319.71) | fabs) < 0.001)) and
            ([.commands[] | select(.command == "sketch.create") |
              .params.plane] | index("XZ")) != null
          ' output/native/hub75-wood-frame/commands.json
          # Check representative editable SolidCraft feature histories, not just images.
          unzip -p output/native/sample-plate/model.sc document.json > output/native/sample-plate/document.json
          jq -e '
            [.features[] | select(.type == "sketch") | .name] == ["Base","Holes","Boss","Bore"]
            and ([.features[] | select(.type == "hole")] | length) == 0
          ' output/native/sample-plate/document.json
          unzip -p output/native/plastic-enclosure/model.sc document.json > output/native/plastic-enclosure/document.json
          jq -e '
            [.features[].type] ==
              ["sketch","extrude","shell","lip","snap_fit","boss","boss","rest"]
          ' output/native/plastic-enclosure/document.json
          jq -e '
            [.commands[] | select(.command == "sketch.create") | .params.name] ==
              ["PlasticEnclosurePi footprint","Pi ports",
               "USB and Ethernet","Floor vents","Pi 4 engraving"]
            and ([.commands[] | select(.command == "plastic.boss")] | length) == 4
          ' output/native/plastic-enclosure-pi/commands.json
          jq -e '
            .body_count == 1 and .bodies[0].name == "PlasticEnclosurePi"
            and .bodies[0].closed == true
            and .bodies[0].material == "PETG"
            and (.sketches | length) == 5
          ' output/native/plastic-enclosure-pi/measurements.json
          jq -e '
            .body_count == 1 and .bodies[0].name == "CornerBracket"
            and .bodies[0].closed == true
          ' output/native/corner-bracket/measurements.json
      - name: Native comparison of independent SCPF and SCPC designs
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          for model in plate corner-bracket; do
            mkdir -p "output/native/$model/scpf" "output/native/$model/scpc"
            cp "output/native/$model/measurements.json" "output/native/$model/scpf/measurements.json"
            python -m scpc "$(python scripts/ci/model_catalog.py "$model" scpc)" \
              --out "output/native/$model/scpc/commands.json"
            solidcraft-cli run "output/native/$model/scpc/commands.json" \
              --param-check strict --results \
              --json-out "output/native/$model/scpc/results.json" \
              --save "output/native/$model/scpc/model.sc" \
              --out "output/native/$model/scpc/model.step"
            solidcraft-cli eval "output/native/$model/scpc/model.sc" \
              --json-out "output/native/$model/scpc/measurements.json"
            jq -e '(.timeline | all(.error == null))' \
              "output/native/$model/scpc/measurements.json"
            python scripts/ci/compare-scpc.py output/native "$model"
          done
      - name: Build source-matched native result pages
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg source "$GITHUB_SHA" --arg scpf "$SCPF_COMMIT" \
            --arg version "$SOLIDCRAFT_VERSION" --arg run "$GITHUB_RUN_ID" \
            '{source_commit:$source,scpf_commit:$scpf,solidcraft_version:$version,workflow_run:$run,verified:true}' \
            > output/native/verification.json
          for model in plate csg-cube bracket sample-plate plastic-enclosure plastic-enclosure-pi corner-bracket hub75-panel hub75-screen hub75-wood-frame; do
            python -m scpf "$(python scripts/ci/model_catalog.py "$model")" \
              --out "output/models/$model/scpf/solidcraft.json"
          done
          for model in plate corner-bracket; do
            python -m scpc "$(python scripts/ci/model_catalog.py "$model" scpc)" \
              --out "output/models/$model/scpc/solidcraft.json"
          done
          python scripts/ci/build-results.py --generated output/models --native output/native --commit "$GITHUB_SHA" --out output/site
          python scripts/ci/test-results.py output/site "$GITHUB_SHA"
          for model in plate bracket sample-plate plastic-enclosure plastic-enclosure-pi corner-bracket hub75-panel hub75-screen hub75-wood-frame; do
            test -s "output/site/models/$model/native.png"
          done
          jq -e --arg scpf "$SCPF_COMMIT" --arg source "$GITHUB_SHA" \
            '.scpf_commit == $scpf and .source_commit == $source and (.native_verified_models | length)  >= 9' \
            output/site/provenance.json
      - name: Retain native geometry, command plans and site bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cad-evidence
          path: |
            output/native/
            output/site/
          if-no-files-found: warn
      - name: Publish verified site on main only
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: true
          commit_message: "Verified SolidCraft CAD website at ${{ github.sha }}"
