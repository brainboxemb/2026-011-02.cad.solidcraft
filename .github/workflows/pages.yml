name: Pages

on:
  pull_request:
    branches: [dev, main, exp]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "modules/pages/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out build output
        uses: actions/checkout@v7
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pages runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Resolve matching durable Pages scope
        id: scope
        run: |
          scope=main
          if [ "${{ github.base_ref }}" = "exp" ] || [ "${{ github.head_ref }}" = "exp" ]; then
            if [ -s prepared-build/exp/build-plan.json ]; then
              scope=exp
            else
              echo "No durable exp scope yet; using dev for initial exp bootstrap verification"
              scope=dev
            fi
          elif [ "${{ github.base_ref }}" = "dev" ] || [ "${{ github.head_ref }}" = "dev" ]; then
            scope=dev
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Build and verify Pages
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root .
          --build-scope prepared-build/${{ steps.scope.outputs.scope }}
          --destination generated-site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --source-repository "${{ github.repository }}"
          --source-ref "${{ github.event.pull_request.head.sha }}"

  assemble:
    name: pages-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out stable source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main
          fetch-depth: 0
          persist-credentials: true

      - name: Check out development source
        uses: actions/checkout@v7
        with:
          ref: dev
          path: source-dev
          fetch-depth: 0
          persist-credentials: false

      - name: Check out build output
        uses: actions/checkout@v7
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Detect optional experimental source
        id: exp
        run: |
          if git -C source-main ls-remote --exit-code --heads origin refs/heads/exp >/dev/null 2>&1 && [ -s prepared-build/exp/build-plan.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out experimental source
        if: steps.exp.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: exp
          path: source-exp
          fetch-depth: 0
          persist-credentials: false

      - name: Detect rolling test source
        id: test
        run: |
          if [ -s prepared-build/test/build-plan.json ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          plan = json.loads(Path("prepared-build/test/build-plan.json").read_text())
          source_sha = plan.get("source_sha")
          source_ref = plan.get("source_ref")
          if not isinstance(source_sha, str) or len(source_sha) != 40:
              raise SystemExit("test build plan has no exact source_sha")
          if not isinstance(source_ref, str) or not source_ref:
              raise SystemExit("test build plan has no source_ref")
          print("exists=true")
          print(f"source_sha={source_sha}")
          print(f"source_ref={source_ref}")
          PY
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out rolling test source
        if: steps.test.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.test.outputs.source_sha }}
          path: source-test
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pages runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build stable site
        env:
          PYTHONPATH: source-main/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-main
          --build-scope prepared-build/main
          --destination generated-site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --source-repository "${{ github.repository }}"
          --source-ref main

      - name: Build development site
        env:
          PYTHONPATH: source-dev/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-dev
          --build-scope prepared-build/dev
          --destination generated-site/dev
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev/"
          --source-repository "${{ github.repository }}"
          --source-ref dev

      - name: Build experimental site
        if: steps.exp.outputs.exists == 'true'
        env:
          PYTHONPATH: source-exp/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-exp
          --build-scope prepared-build/exp
          --destination generated-site/exp
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/exp/"
          --source-repository "${{ github.repository }}"
          --source-ref exp

      - name: Build rolling test site
        if: steps.test.outputs.exists == 'true'
        env:
          PYTHONPATH: source-test/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-test
          --build-scope prepared-build/test
          --destination generated-site/test
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test/"
          --source-repository "${{ github.repository }}"
          --source-ref "${{ steps.test.outputs.source_sha }}"

      - name: Publish Pages branch
        env:
          PYTHONPATH: source-main/modules/pages/src
        run: >-
          python -m cad_model_pages.publish
          --repo source-main
          --site "${GITHUB_WORKSPACE}/generated-site"
          --source-ref main
          --source-sha "$(git -C source-main rev-parse HEAD)"
