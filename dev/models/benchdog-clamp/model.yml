title: Benchdog Clamp (WIP)
tagline: Source-derived MFT rail clamp concept with low hinge and Ø20 bench-dog reference
description: >
  Work-in-progress reconstruction of the final visible state in the supplied
  doghole_clamp2 SolidCraft design. The active baseline keeps the low T-slide
  with fixed centre hinge eye, mirrored side arms, Ø3 hinge pin, 40 mm dummy
  rail-profile fit context and a straight Ø20 bench-dog reference. Earlier
  expansion-dog and compact-fork concepts remain in the retained source but are
  deliberately not part of this active Forge baseline.
parameters: rail 12 / 7 mm with 0.3 mm clearance; Ø3 hinge pin; R3 hinge eye; 0.25 mm axial clearance; 12.55 / 8.30 mm source profile; 40 mm rail context; Ø20 dog at 19.5 mm
stages:
  - T-slide — reconstruct native features 63-66 plus late right-side thickening feature 80
  - Hinge arms — use one source arm definition twice at Y = -6 / +6
  - Pin — retain the native Ø3 × 16.5 mm low hinge pin and Ø5 head
  - Rail context — rebuild the 20-point XZ profile and symmetric 40 mm extrusion
  - Rail fillets — reproduce source R1.6 slot-lip and R0.9 lower profile rounds
  - Bench dog — retain the straight Ø20 × 27.5 mm reference; source head remains suppressed
  - Final datum — apply the common source feature-83 Z shift to all visible bodies
