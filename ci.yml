schema: 1

branches:
  stable: main
  development: dev
  temporary_prefixes:
    - issue/
    - fix/
    - feature/
    - docs/
    - chore/

generated:
  build_branch: build
  pages_branch: gh-pages

dependencies:
  forge:
    repository: brainboxemb/lib.py.solidcraft.forge
    version: v0.25.0
  # Qualification-only candidate from docker.cad.solidcraft#36.
  # Never merge the mutable :edge pin; immutable adoption follows runtime v0.3.8.
  solidcraft:
    image: ghcr.io/brainboxemb/cad-solidcraft:edge
    version: 0.50.0

roots:
  modules: modules
  models: models
  output: build
