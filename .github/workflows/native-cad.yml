          python -m pip install -e ext/scpc
          echo "SCPF_COMMIT=$(git -C ext/scpf rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SCPC_COMMIT=$(git -C ext/scpc rev-parse HEAD)" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from scpf.version import TESTED_SOLIDCRAFT_VERSION

          actual = version("scpf")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SCPF_RELEASE={actual}\n")
          engine = os.environ["SOLIDCRAFT_VERSION"]
          if TESTED_SOLIDCRAFT_VERSION != engine:
              raise SystemExit(
                  "Forge/SolidCraft qualification mismatch: "
                  f"Forge expects {TESTED_SOLIDCRAFT_VERSION}, workflow uses {engine}"
              )
          print(f"SCPF {actual}; SolidCraft {engine}")
          PY
      - name: Download the verified official SolidCraft release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" --output "$ARCHIVE"
