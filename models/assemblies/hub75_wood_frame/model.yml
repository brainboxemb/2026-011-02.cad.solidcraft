purpose: [example]
section: assemblies
group: display-case
priority: 40
title: Hub75DisplayCase
tagline: Parametrized 12 mm plywood box, eight brackets and one GlassStrip type
description: >
  One clearly parametrized assembly: five lightweight HUB75 modules, 12 mm
  sidewalls/bottom/roof, 9 mm attached rear, 4 mm glass and four
  straight-mitred wooden retainers from one GlassStrip class. The roof extends
  10 mm in front and 1 mm beyond the attached rear sheet. Eight printed corner
  brackets share the CornerBracket definition.
parameters: Outer 868 × 386 mm; 12 mm ply, 9 mm rear; roof 10/1 mm overhang; eight brackets
stages:
  - Define one central parameter set and the wooden component types
  - Place five lightweight HUB75 panel occurrences on the 160 mm grid
  - Place 12 mm sidewalls, R4 bottom and roof with 10/1 mm overhang
  - Attach the 9 mm back board and place the 4 mm window behind the strips
  - Create two length variants of one GlassStrip type and place four mitred pieces
  - Place eight shared CornerBracket occurrences, front and rear
extra_views:
  title: Assembly review
  note: The exploded snapshot is a stored SolidCraft presentation view; the accepted model remains assembled and all normal occurrence placements are unchanged.
