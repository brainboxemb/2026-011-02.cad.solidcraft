            --arg scpf "$SCPF_COMMIT" \
            --arg scpf_release "$SCPF_RELEASE" \
            --arg scpc "$SCPC_COMMIT" \
            --arg source "$GITHUB_SHA" \
            --arg solidcraft "$SOLIDCRAFT_VERSION" \
