title: Hub75Panel
tagline: Measured P5 HUB75 panel with native-source rear contours and connectors
description: >
  Shared 159.70 × 319.71 × 14.50 mm P5 HUB75 panel from the supplied
  hub75_improved native source. The reusable housing keeps its established
  local XY/Z contract for screen assemblies, while the standalone detailed
  model adds the refined rounded/stepped rear bays, side-wall trimming,
  two HUB75 data connector envelopes, the approximate power connector and
  four white orientation markings as separate source-derived occurrences.
parameters: 159.70 × 319.71 × 14.50 mm body; R5 nominal rear-bay corners; 30 mm nominal central bay narrowing; six Ø3 bores in Ø8.5 tubes; two 27.90 × 9.50 × 10.64 mm data connector envelopes
stages:
  - Build the straight front envelope and continuous 1.25 mm rear taper
  - Cut four connected rounded and centrally narrowed rear electronics bays
  - Restore six Ø8.5 mounting tubes, shallow reliefs and six reinforcement bosses
  - Add the two Ø3 × 3 mm locator pins and reopen all six Ø3 mounting bores
  - Trim rear additions to the true long sloping side-wall envelope
  - Add two HUB75 data connector envelopes and the approximate power connector
  - Add four 0.10 mm white source orientation markings
