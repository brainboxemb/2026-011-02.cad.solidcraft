name: Native SolidCraft CAD verification and results site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Model selection mode
        type: choice
        required: true
        default: changed
        options: [changed, models, all]
      models:
        description: Space- or comma-separated model slugs for models mode
        type: string
        required: false
        default: ""
      publish:
        description: Publish target for a manual run
        type: choice
        required: true
        default: preview
        options: [preview, stable]

permissions:
  contents: read
  packages: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'changed' }}
      BUILD_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || '' }}
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'preview' }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout promoted build output
        uses: actions/checkout@v4
        with:
          ref: build
          path: build

      - name: Checkout current stable site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable CAD image
        id: image
        run: |
          python scripts/ci/cad_image.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable CAD image
        run: docker pull "${{ steps.image.outputs.reference }}"

      - name: Run selected native CAD verification
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e BUILD_MODE \
            -e BUILD_MODELS \
            -e PUBLISH_TARGET \
            -e BASE_SHA \
            -e HEAD_SHA \
            -e EVENT_NAME \
            -e REF_NAME \
            -e PR_NUMBER \
            -e GITHUB_RUN_ID \
            "${{ steps.image.outputs.reference }}" \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              plan_args=(
                --mode "$BUILD_MODE"
                --models "$BUILD_MODELS"
                --base "$BASE_SHA"
                --head "$HEAD_SHA"
                --event-name "$EVENT_NAME"
                --ref-name "$REF_NAME"
                --publish "$PUBLISH_TARGET"
                --out output/plan.json
              )
              if [ "$PR_NUMBER" != "0" ]; then
                plan_args+=(--pull-request "$PR_NUMBER")
              fi
              python scripts/ci/build_plan.py "${plan_args[@]}"
              python scripts/ci/native_ci.py \
                --plan output/plan.json \
                --out output \
                --stable-store build/main \
                --previous-site previous-site \
                --source-sha "$HEAD_SHA" \
                --workflow-run "$GITHUB_RUN_ID" \
                --image-reference "${{ steps.image.outputs.reference }}"
            '

      - name: Upload staged publication bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cad-publish
          path: |
            output/candidate/
            output/site/
            output/plan.json
            output/publish.json
          if-no-files-found: ignore
